<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" style="font-family: var(--font-sans)">
  <style>
    .lbl { font-size: 12px; fill: var(--fg-secondary); }
    .hd { font-size: 14px; font-weight: 480; fill: var(--fg-primary); }
    .bx { fill: none; stroke: var(--fg-secondary); stroke-width: 1; }
    .zone { fill: none; stroke: var(--border-translucent); stroke-width: 1; stroke-dasharray: 4 3; }
    .greek { fill: var(--border-translucent); }
    .rail { stroke: var(--border-translucent); stroke-width: 1; }
  </style>

  <!-- header bar -->
  <rect x="8" y="8" width="624" height="34" rx="8" class="bx"/>
  <text x="24" y="30" class="hd">SHOP</text>
  <text x="300" y="30" class="hd">JORCUSTOM</text>
  <text x="560" y="29" class="lbl">account / cart</text>

  <!-- dropdown panel -->
  <rect x="8" y="52" width="624" height="280" rx="8" class="bx"/>

  <!-- tabs -->
  <rect x="28" y="70" width="104" height="26" rx="13" fill="var(--bg-accent-translucent)"/>
  <text x="48" y="87" style="font-size:12px; fill: var(--fg-accent)">Categorieën</text>
  <rect x="140" y="70" width="92" height="26" rx="13" fill="var(--bg-muted)"/>
  <text x="160" y="87" class="lbl">Collecties</text>
  <rect x="240" y="70" width="66" height="26" rx="13" fill="var(--bg-muted)"/>
  <text x="264" y="87" class="lbl">Sale</text>
  <line x1="28" y1="108" x2="450" y2="108" class="rail"/>

  <!-- three columns of category groups -->
  <text x="28" y="130" class="hd">T-Shirts</text>
  <rect x="28" y="140" width="80" height="7" rx="3.5" class="greek"/>
  <rect x="28" y="153" width="96" height="7" rx="3.5" class="greek"/>
  <rect x="28" y="166" width="70" height="7" rx="3.5" class="greek"/>
  <text x="28" y="196" class="hd">Sweatshirts</text>
  <rect x="28" y="206" width="90" height="7" rx="3.5" class="greek"/>
  <rect x="28" y="219" width="76" height="7" rx="3.5" class="greek"/>

  <text x="168" y="130" class="hd">Pants</text>
  <rect x="168" y="140" width="86" height="7" rx="3.5" class="greek"/>
  <rect x="168" y="153" width="66" height="7" rx="3.5" class="greek"/>
  <text x="168" y="196" class="hd">Jackets</text>
  <rect x="168" y="206" width="80" height="7" rx="3.5" class="greek"/>
  <rect x="168" y="219" width="94" height="7" rx="3.5" class="greek"/>

  <text x="308" y="130" class="hd">Accessoires</text>
  <rect x="308" y="140" width="72" height="7" rx="3.5" class="greek"/>
  <rect x="308" y="153" width="88" height="7" rx="3.5" class="greek"/>
  <text x="308" y="196" class="hd">Gifts</text>
  <rect x="308" y="206" width="64" height="7" rx="3.5" class="greek"/>

  <!-- sale row preview inside panel -->
  <rect x="28" y="248" width="418" height="60" rx="8" class="zone"/>
  <text x="40" y="266" class="lbl">sale-tab</text>
  <rect x="40" y="274" width="60" height="22" rx="11" fill="var(--bg-muted)"/>
  <text x="55" y="289" class="lbl">-20%</text>
  <rect x="108" y="274" width="60" height="22" rx="11" fill="var(--bg-muted)"/>
  <text x="123" y="289" class="lbl">-30%</text>
  <rect x="176" y="274" width="60" height="22" rx="11" fill="var(--bg-muted)"/>
  <text x="191" y="289" class="lbl">-40%</text>
  <rect x="244" y="274" width="60" height="22" rx="11" fill="var(--bg-muted)"/>
  <text x="259" y="289" class="lbl">-50%</text>
  <rect x="312" y="274" width="60" height="22" rx="11" fill="var(--bg-muted)"/>
  <text x="327" y="289" class="lbl">-70%</text>

  <!-- image panel -->
  <rect x="466" y="70" width="148" height="238" rx="8" fill="var(--bg-tertiary)"/>
  <text x="500" y="194" class="lbl">menu-afbeelding</text>
</svg>
